name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run self-tests
        shell: pwsh
        run: |
          dotnet build Altabi.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          $process = Start-Process -FilePath src/Altabi/bin/Release/net10.0-windows/win-x64/Altabi.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Self-tests failed with exit code $($process.ExitCode)." }
      - name: Publish portable release
        shell: pwsh
        run: |
          ./scripts/publish-portable.ps1 -AppName Altabi -ProjectPath src/Altabi/Altabi.csproj -Version $env:GITHUB_REF_NAME
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath artifacts/release -File | Select-Object -ExpandProperty FullName
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title "Altabi $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
